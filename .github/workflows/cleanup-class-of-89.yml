name: Cleanup Class of 89 Playlist

on:
  push:
    paths:
      - scripts/cleanup_class_of_89.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clean playlist
        run: python scripts/cleanup_class_of_89.py
      - name: Commit cleaned playlist and report
        run: |
          if git diff --quiet -- playlists/sony_walkman_sessions_class_of_89.csv reports/class_of_89_cleanup_report.csv; then
            echo "No cleanup changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlists/sony_walkman_sessions_class_of_89.csv reports/class_of_89_cleanup_report.csv
          git commit -m "chore: clean original Sony Walkman playlist"
          git push
